apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-deployment
  labels:
    app: mi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi
  template:
    metadata:
      labels:
        app: mi
    spec:
      containers:
      - name: wso2-mi
        image: mi-local-image:wso2mi_410_sit0001
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8290

        volumeMounts:
        - name: truststore-volume
          mountPath: /home/wso2carbon/client-truststore.jks
          subPath: client-truststore.jks

      volumes:
      - name: truststore-volume
        configMap:
          name: mi-truststore-config
